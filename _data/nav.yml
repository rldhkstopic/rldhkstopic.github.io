# 상단 네비게이션 항목
# 데스크톱 헤더와 모바일 드로어가 이 목록을 함께 사용한다.
# 메뉴를 추가/변경할 때는 이 파일만 고치면 양쪽에 반영된다.
#
# 사이트는 두 축으로 구성한다.
#   개발 — 기술 자산 (VHDL/C#/Vivado 노트, 프로젝트 문서, 학습 정리)
#   기록 — 일상 기록
# 기존 글의 URL(/dev/, /project/, /study/, /document/, /daily/)은 그대로 두었다.
# Giscus 댓글이 pathname 으로 매핑되어 있어 URL 을 바꾸면 댓글이 끊기기 때문이다.
- title: 홈
  url: /
- title: 개발
  url: /dev/
- title: 기록
  url: /daily/
- title: 프로젝트
  url: /project/
